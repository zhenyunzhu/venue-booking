name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: 123456
          MYSQL_DATABASE: venue_booking
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -p123456"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Init database
        run: |
          mysql -h 127.0.0.1 -uroot -p123456 < sql/01_ddl.sql
          mysql -h 127.0.0.1 -uroot -p123456 venue_booking < sql/02_init_data.sql
          mysql -h 127.0.0.1 -uroot -p123456 venue_booking < sql/03_m9_upgrade.sql

      - name: Build & Test
        run: mvn -B package
        env:
          MYSQL_PASSWORD: 123456
